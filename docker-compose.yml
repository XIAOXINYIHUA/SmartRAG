version: "3.8"

services:
  smartrag-web:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./.env:/app/.env
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped

  smartrag-api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./.env:/app/.env
    restart: unless-stopped
